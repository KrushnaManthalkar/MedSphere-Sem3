<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctors | MedSphere</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/}">MedSphere</a><a class="btn btn-outline-light btn-sm" th:href="@{/admin/departments}">Departments</a></div></nav><main class="container py-4"><div class="d-flex justify-content-between mb-3"><div><h1 class="h3">Doctors</h1><p class="text-muted">Admin management</p></div><a class="btn btn-primary" th:href="@{/admin/doctors/new}">Add Doctor</a></div><div class="card shadow-sm border-0"><table class="table table-hover mb-0"><thead class="table-light"><tr><th>Name</th><th>Username</th><th>Department</th><th>Specialization</th><th>Phone</th><th></th></tr></thead><tbody><tr th:each="doctor : ${doctors}"><td th:text="${doctor.user.fullName}"></td><td th:text="${doctor.user.username}"></td><td th:text="${doctor.department.name}"></td><td th:text="${doctor.specialization}"></td><td th:text="${doctor.phone}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/doctors/{id}(id=${doctor.id})}">View</a> <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/doctors/{id}/edit(id=${doctor.id})}">Edit</a></td></tr><tr th:if="${#lists.isEmpty(doctors)}"><td colspan="6" class="text-center text-muted py-4">No doctor profiles created yet.</td></tr></tbody></table></div></main></body></html>
