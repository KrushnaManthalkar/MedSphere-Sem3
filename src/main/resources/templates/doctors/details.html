<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Profile | MedSphere</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:750px"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div class="d-flex justify-content-between"><div><h1 class="h3" th:text="${doctor.user.fullName}"></h1><p class="text-muted" th:text="${doctor.specialization}"></p></div><a class="btn btn-primary" th:href="@{/admin/doctors/{id}/edit(id=${doctor.id})}">Edit Doctor</a></div><div class="card shadow-sm border-0"><div class="card-body"><dl class="row mb-0"><dt class="col-sm-4">Username</dt><dd class="col-sm-8" th:text="${doctor.user.username}"></dd><dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${doctor.user.email ?: '-'}"></dd><dt class="col-sm-4">Department</dt><dd class="col-sm-8" th:text="${doctor.department.name}"></dd><dt class="col-sm-4">Specialization</dt><dd class="col-sm-8" th:text="${doctor.specialization}"></dd><dt class="col-sm-4">Phone</dt><dd class="col-sm-8" th:text="${doctor.phone}"></dd></dl></div></div><a class="btn btn-outline-secondary mt-3" th:href="@{/admin/doctors}">Back to Doctors</a></main></body></html>
