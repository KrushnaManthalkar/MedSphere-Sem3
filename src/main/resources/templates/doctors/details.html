<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Profile | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="dashboard-page">

<nav class="navbar navbar-expand-lg med-navbar">

    <div class="container-fluid px-4">

        <a class="navbar-brand med-brand"
           th:href="@{/}">
            <span class="brand-icon">+</span>
            MedSphere
        </a>

        <div class="d-flex gap-2">

            <a class="btn btn-outline-light btn-sm"
               th:href="@{/admin/doctors}">
                Back to Doctors
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="m-0">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button class="btn btn-outline-light btn-sm"
                        type="submit">
                    Sign out
                </button>

            </form>

        </div>

    </div>

</nav>


<main class="container-fluid px-4 py-4">

    <div th:if="${successMessage}"
         class="alert alert-success shadow-sm"
         th:text="${successMessage}">
    </div>


    <!-- Header -->

    <div class="page-header mb-4">

        <div>

            <div class="page-eyebrow">
                DOCTOR PROFILE
            </div>

            <h1 th:text="${doctor.user.fullName}">
                Doctor Name
            </h1>

            <p th:text="${doctor.specialization}">
                Specialization
            </p>

        </div>

        <a class="btn btn-primary px-4"
           th:href="@{/admin/doctors/{id}/edit(id=${doctor.id})}">
            Edit Doctor
        </a>

    </div>


    <!-- Doctor Information -->

    <section class="content-card">

        <div class="content-card-header">

            <div>
                <h2>Professional Information</h2>
                <p>Doctor account and profile details</p>
            </div>

        </div>


        <div class="card-body p-4">

            <div class="row g-4">

                <div class="col-md-6 col-lg-4">

                    <div class="detail-item">

                        <span>Full Name</span>

                        <strong th:text="${doctor.user.fullName}">
                            -
                        </strong>

                    </div>

                </div>


                <div class="col-md-6 col-lg-4">

                    <div class="detail-item">

                        <span>Username</span>

                        <strong th:text="${doctor.user.username}">
                            -
                        </strong>

                    </div>

                </div>


                <div class="col-md-6 col-lg-4">

                    <div class="detail-item">

                        <span>Email</span>

                        <strong th:text="${doctor.user.email ?: '-'}">
                            -
                        </strong>

                    </div>

                </div>


                <div class="col-md-6 col-lg-4">

                    <div class="detail-item">

                        <span>Department</span>

                        <strong th:text="${doctor.department.name}">
                            -
                        </strong>

                    </div>

                </div>


                <div class="col-md-6 col-lg-4">

                    <div class="detail-item">

                        <span>Specialization</span>

                        <strong th:text="${doctor.specialization}">
                            -
                        </strong>

                    </div>

                </div>


                <div class="col-md-6 col-lg-4">

                    <div class="detail-item">

                        <span>Phone</span>

                        <strong th:text="${doctor.phone}">
                            -
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <div class="mt-4">

        <a class="btn btn-outline-secondary"
           th:href="@{/admin/doctors}">
            ← Back to Doctors
        </a>

    </div>

</main>

</body>
</html>
