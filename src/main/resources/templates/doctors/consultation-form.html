<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Start Consultation | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-semibold"
           th:href="@{/}">
            MedSphere
        </a>

        <div class="d-flex align-items-center gap-3">

            <span class="text-white"
                  th:text="${doctor.user.fullName}">
                Doctor
            </span>

            <form th:action="@{/logout}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Sign out
                </button>

            </form>

        </div>

    </div>
</nav>

<main class="container py-4">

    <div class="mb-4">

        <a th:href="@{/doctor/appointments/{id}(id=${appointment.id})}"
           class="text-decoration-none">
            ← Back to Appointment
        </a>

        <h1 class="h3 mt-3 mb-1">
            Start Consultation
        </h1>

        <p class="text-muted mb-0">
            Record consultation details for the patient.
        </p>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="mb-4">

                <h5 class="mb-3">
                    Patient Information
                </h5>

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label text-muted">
                            Patient Name
                        </label>

                        <div class="fw-semibold"
                             th:text="${appointment.patient.name}">
                            Patient Name
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label text-muted">
                            Patient Code
                        </label>

                        <div class="fw-semibold"
                             th:text="${appointment.patient.patientCode}">
                            MSP-000000
                        </div>

                    </div>

                </div>

            </div>

            <hr>

            <form th:action="@{/doctor/appointments/{id}/consultation(id=${appointment.id})}"
                  th:object="${form}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">

                    <label for="consultationDate"
                           class="form-label">
                        Consultation Date
                    </label>

                    <input type="date"
                           id="consultationDate"
                           th:field="*{consultationDate}"
                           class="form-control"
                           required>

                </div>


                <div class="mb-3">

                    <label for="symptoms"
                           class="form-label">
                        Symptoms
                    </label>

                    <textarea id="symptoms"
                              th:field="*{symptoms}"
                              class="form-control"
                              rows="4"
                              placeholder="Enter patient's symptoms..."
                              required></textarea>

                </div>


                <div class="mb-3">

                    <label for="diagnosis"
                           class="form-label">
                        Diagnosis
                    </label>

                    <textarea id="diagnosis"
                              th:field="*{diagnosis}"
                              class="form-control"
                              rows="4"
                              placeholder="Enter diagnosis..."
                              required></textarea>

                </div>


                <div class="mb-4">

                    <label for="notes"
                           class="form-label">
                        Notes
                    </label>

                    <textarea id="notes"
                              th:field="*{notes}"
                              class="form-control"
                              rows="4"
                              placeholder="Enter additional consultation notes..."></textarea>

                </div>


                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/doctor/appointments/{id}(id=${appointment.id})}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        Save Consultation
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

</body>
</html>
