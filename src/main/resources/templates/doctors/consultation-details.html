<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultation Details | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-semibold"
           th:href="@{/}">
            MedSphere
        </a>

        <div class="d-flex align-items-center gap-3">

            <span class="text-white"
                  th:text="${doctor.user.fullName}">
                Doctor
            </span>

            <form th:action="@{/logout}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Sign out
                </button>

            </form>

        </div>

    </div>
</nav>

<main class="container py-4">

    <div class="mb-4">

        <a th:href="@{/doctor/appointments/{id}(id=${appointment.id})}"
           class="text-decoration-none">
            ← Back to Appointment
        </a>

        <h1 class="h3 mt-3 mb-1">
            Consultation Details
        </h1>

        <p class="text-muted mb-0">
            Consultation record for the patient.
        </p>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body">

            <h5 class="mb-4">
                Patient Information
            </h5>

            <div class="row g-4">

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Patient Name
                    </label>

                    <div class="fw-semibold"
                         th:text="${appointment.patient.name}">
                        Patient Name
                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Patient Code
                    </label>

                    <div class="fw-semibold"
                         th:text="${appointment.patient.patientCode}">
                        MSP-000000
                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Consultation Date
                    </label>

                    <div th:text="${consultation.consultationDate}">
                        Date
                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Appointment Date
                    </label>

                    <div th:text="${appointment.appointmentDate}">
                        Date
                    </div>

                </div>

            </div>

            <hr class="my-4">


            <div class="mb-4">

                <label class="form-label text-muted">
                    Symptoms
                </label>

                <div class="border rounded p-3 bg-light"
                     th:text="${consultation.symptoms}">
                    Symptoms
                </div>

            </div>


            <div class="mb-4">

                <label class="form-label text-muted">
                    Diagnosis
                </label>

                <div class="border rounded p-3 bg-light"
                     th:text="${consultation.diagnosis}">
                    Diagnosis
                </div>

            </div>


            <div class="mb-4">

                <label class="form-label text-muted">
                    Notes
                </label>

                <div th:if="${consultation.notes != null and !#strings.isEmpty(consultation.notes)}"
                     class="border rounded p-3 bg-light"
                     th:text="${consultation.notes}">
                    Notes
                </div>

                <div th:if="${consultation.notes == null or #strings.isEmpty(consultation.notes)}"
                     class="text-muted">
                    No additional notes.
                </div>

            </div>


            <div class="d-flex justify-content-end">

                <a th:href="@{/doctor/appointments/{id}(id=${appointment.id})}"
                   class="btn btn-outline-secondary">
                    Back to Appointment
                </a>

            </div>

        </div>

    </div>

</main>

</body>
</html>
