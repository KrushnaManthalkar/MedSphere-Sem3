<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Prescription | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-semibold"
           th:href="@{/}">
            MedSphere
        </a>

        <div class="d-flex align-items-center gap-3">

            <span class="text-white"
                  th:text="${doctor.user.fullName}">
                Doctor
            </span>

            <form th:action="@{/logout}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Sign out
                </button>

            </form>

        </div>

    </div>
</nav>

<main class="container py-4">

    <div class="mb-4">

        <a th:href="@{/doctors/appointments/{id}/consultation/details(id=${appointment.id})}"
           class="text-decoration-none">
            ← Back to Consultation
        </a>

        <h1 class="h3 mt-3 mb-1">
            Add Prescription
        </h1>

        <p class="text-muted mb-0">
            Add medicine details for the patient.
        </p>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body">

            <h5 class="mb-4">
                Patient Information
            </h5>

            <div class="row g-3 mb-4">

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Patient Name
                    </label>

                    <div class="fw-semibold"
                         th:text="${appointment.patient.name}">
                        Patient Name
                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Patient Code
                    </label>

                    <div class="fw-semibold"
                         th:text="${appointment.patient.patientCode}">
                        MSP-000000
                    </div>

                </div>

            </div>

            <hr class="my-4">


            <form th:action="@{/doctors/appointments/{id}/consultation/prescription(id=${appointment.id})}"
                  th:object="${prescriptionForm}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <div class="mb-3">

                    <label for="medicineName"
                           class="form-label">
                        Medicine Name
                    </label>

                    <input type="text"
                           id="medicineName"
                           th:field="*{medicineName}"
                           class="form-control"
                           placeholder="Enter medicine name"
                           required>

                </div>


                <div class="row g-3">

                    <div class="col-md-4">

                        <label for="dosage"
                               class="form-label">
                            Dosage
                        </label>

                        <input type="text"
                               id="dosage"
                               th:field="*{dosage}"
                               class="form-control"
                               placeholder="e.g. 500 mg"
                               required>

                    </div>


                    <div class="col-md-4">

                        <label for="frequency"
                               class="form-label">
                            Frequency
                        </label>

                        <input type="text"
                               id="frequency"
                               th:field="*{frequency}"
                               class="form-control"
                               placeholder="e.g. Twice daily"
                               required>

                    </div>


                    <div class="col-md-4">

                        <label for="duration"
                               class="form-label">
                            Duration
                        </label>

                        <input type="text"
                               id="duration"
                               th:field="*{duration}"
                               class="form-control"
                               placeholder="e.g. 5 days"
                               required>

                    </div>

                </div>


                <div class="mb-4 mt-3">

                    <label for="instructions"
                           class="form-label">
                        Instructions
                    </label>

                    <textarea id="instructions"
                              th:field="*{instructions}"
                              class="form-control"
                              rows="4"
                              placeholder="Optional instructions"></textarea>

                </div>


                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/doctors/appointments/{id}/consultation/details(id=${appointment.id})}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        Save Prescription
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

</body>
</html>
