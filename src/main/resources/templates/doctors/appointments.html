<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Appointments | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-semibold"
           th:href="@{/}">
            MedSphere
        </a>

        <div class="d-flex align-items-center gap-3">

            <span class="text-white"
                  th:text="${doctor.user.fullName}">
                Doctor
            </span>

            <form th:action="@{/logout}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Sign out
                </button>

            </form>

        </div>

    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <a th:href="@{/}"
               class="text-decoration-none">
                ← Back to Home
            </a>

            <h1 class="h3 mt-3 mb-1">
                My Appointments
            </h1>

            <p class="text-muted mb-0">
                View appointments assigned to you.
            </p>
        </div>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body p-0">

            <div th:if="${#lists.isEmpty(appointments)}"
                 class="text-center py-5">

                <h5 class="mb-2">
                    No appointments found
                </h5>

                <p class="text-muted mb-0">
                    You currently have no appointments.
                </p>

            </div>

            <div th:unless="${#lists.isEmpty(appointments)}"
                 class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>
                        <th>Patient</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th class="text-end">Action</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="appointment : ${appointments}">

                        <td>

                            <div class="fw-semibold"
                                 th:text="${appointment.patient.name}">
                                Patient
                            </div>

                            <small class="text-muted"
                                   th:text="${appointment.patient.patientCode}">
                                MSP-000000
                            </small>

                        </td>

                        <td th:text="${appointment.appointmentDate}">
                            Date
                        </td>

                        <td th:text="${appointment.appointmentTime}">
                            Time
                        </td>

                        <td>

                            <span th:if="${appointment.reason != null}"
                                  th:text="${appointment.reason}">
                            </span>

                            <span th:if="${appointment.reason == null}"
                                  class="text-muted">
                                Not specified
                            </span>

                        </td>

                        <td>

                            <span th:if="${appointment.status.name() == 'SCHEDULED'}"
                                  class="badge text-bg-primary">
                                Scheduled
                            </span>

                            <span th:if="${appointment.status.name() == 'COMPLETED'}"
                                  class="badge text-bg-success">
                                Completed
                            </span>

                            <span th:if="${appointment.status.name() == 'CANCELLED'}"
                                  class="badge text-bg-danger">
                                Cancelled
                            </span>

                        </td>

                        <td class="text-end">

                            <a th:href="@{/doctor/appointments/{id}(id=${appointment.id})}"
                               class="btn btn-sm btn-outline-primary">
                                View
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

</body>
</html>
