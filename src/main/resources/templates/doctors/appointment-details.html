<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointment Details | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-semibold"
           th:href="@{/}">
            MedSphere
        </a>

        <div class="d-flex align-items-center gap-3">

            <span class="text-white"
                  th:text="${doctor.user.fullName}">
                Doctor
            </span>

            <form th:action="@{/logout}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Sign out
                </button>

            </form>

        </div>

    </div>
</nav>

<main class="container py-4">

    <div class="mb-4">

        <a th:href="@{/doctors/appointments}"
           class="text-decoration-none">
            ← Back to My Appointments
        </a>

        <h1 class="h3 mt-3 mb-1">
            Appointment Details
        </h1>

        <p class="text-muted mb-0">
            Review the appointment information before starting the consultation.
        </p>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body">

            <h5 class="card-title mb-4">
                Patient Information
            </h5>

            <div class="row g-4">

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Patient Name
                    </label>

                    <div class="fw-semibold"
                         th:text="${appointment.patient.name}">
                        Patient Name
                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Patient Code
                    </label>

                    <div class="fw-semibold"
                         th:text="${appointment.patient.patientCode}">
                        MSP-000000
                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Appointment Date
                    </label>

                    <div th:text="${appointment.appointmentDate}">
                        Date
                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Appointment Time
                    </label>

                    <div th:text="${appointment.appointmentTime}">
                        Time
                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Doctor
                    </label>

                    <div th:text="${appointment.doctor.user.fullName}">
                        Doctor
                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label text-muted">
                        Status
                    </label>

                    <div>

                        <span th:if="${appointment.status.name() == 'SCHEDULED'}"
                              class="badge text-bg-primary">
                            Scheduled
                        </span>

                        <span th:if="${appointment.status.name() == 'COMPLETED'}"
                              class="badge text-bg-success">
                            Completed
                        </span>

                        <span th:if="${appointment.status.name() == 'CANCELLED'}"
                              class="badge text-bg-danger">
                            Cancelled
                        </span>

                    </div>

                </div>

                <div class="col-12">

                    <label class="form-label text-muted">
                        Reason for Visit
                    </label>

                    <div th:if="${appointment.reason != null}"
                         th:text="${appointment.reason}">
                        Reason
                    </div>

                    <div th:if="${appointment.reason == null}"
                         class="text-muted">
                        Not specified
                    </div>

                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-end gap-2">

                <a th:href="@{/doctors/appointments}"
                class="btn btn-outline-secondary">
                    Back
                </a>

                <a th:if="${appointment.status.name() == 'SCHEDULED'}"
                th:href="@{/doctors/appointments/{id}/consultation(id=${appointment.id})}"
                class="btn btn-primary">
                    Start Consultation
                </a>

                <a th:if="${appointment.status.name() == 'COMPLETED'}"
                th:href="@{/doctors/appointments/{id}/consultation/details(id=${appointment.id})}"
                class="btn btn-success">
                    View Consultation
                </a>

            </div>

        </div>

    </div>

</main>

</body>
</html>
