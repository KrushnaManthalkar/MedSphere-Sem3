<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Doctor | MedSphere</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:750px"><h1 class="h3">Edit Doctor Profile</h1><form class="card card-body shadow-sm" th:action="@{/admin/doctors/{id}(id=${doctor.id})}" th:object="${doctorForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label">Doctor User *</label><select class="form-select" th:field="*{userId}"><option th:each="user : ${doctorUsers}" th:value="${user.id}" th:text="${user.fullName + ' (' + user.username + ')'}"></option></select></div><div class="mb-3"><label class="form-label">Department *</label><select class="form-select" th:field="*{departmentId}"><option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}"></option></select></div><div class="mb-3"><label class="form-label">Specialization *</label><input class="form-control" th:field="*{specialization}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{specialization}"></div></div><div class="mb-3"><label class="form-label">Phone *</label><input class="form-control" th:field="*{phone}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{phone}"></div></div><button class="btn btn-primary">Save Changes</button> <a class="btn btn-outline-secondary" th:href="@{/admin/doctors/{id}(id=${doctor.id})}">Cancel</a></form></main></body></html>
