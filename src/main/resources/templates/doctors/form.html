<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Doctor | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="dashboard-page">

<nav class="navbar navbar-expand-lg med-navbar">

    <div class="container-fluid px-4">

        <a class="navbar-brand med-brand"
           th:href="@{/}">
            <span class="brand-icon">+</span>
            MedSphere
        </a>

        <div class="d-flex gap-2">

            <a class="btn btn-outline-light btn-sm"
               th:href="@{/admin/doctors}">
                Back to Doctors
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="m-0">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button class="btn btn-outline-light btn-sm"
                        type="submit">
                    Sign out
                </button>

            </form>

        </div>

    </div>

</nav>


<main class="container-fluid px-4 py-4">

    <div class="page-header mb-4">

        <div>

            <div class="page-eyebrow">
                ADMINISTRATION
            </div>

            <h1>Add Doctor Profile</h1>

            <p>
                Create a doctor profile using an existing DOCTOR user account.
            </p>

        </div>

    </div>


    <section class="content-card">

        <div class="content-card-header">

            <div>
                <h2>Doctor Information</h2>
                <p>Enter the professional details of the doctor</p>
            </div>

        </div>


        <div class="card-body p-4">

            <form th:action="@{/admin/doctors}"
                  th:object="${doctorForm}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <div class="row g-4">

                    <!-- Doctor User -->

                    <div class="col-md-6">

                        <label for="userId"
                               class="form-label fw-semibold">
                            Doctor User *
                        </label>

                        <select id="userId"
                                class="form-select"
                                th:field="*{userId}"
                                th:errorclass="is-invalid">

                            <option value="">
                                Select doctor user
                            </option>

                            <option th:each="user : ${doctorUsers}"
                                    th:value="${user.id}"
                                    th:text="${user.fullName + ' (' + user.username + ')'}">
                            </option>

                        </select>

                        <div class="invalid-feedback"
                             th:errors="*{userId}">
                        </div>

                    </div>


                    <!-- Department -->

                    <div class="col-md-6">

                        <label for="departmentId"
                               class="form-label fw-semibold">
                            Department *
                        </label>

                        <select id="departmentId"
                                class="form-select"
                                th:field="*{departmentId}"
                                th:errorclass="is-invalid">

                            <option value="">
                                Select department
                            </option>

                            <option th:each="department : ${departments}"
                                    th:value="${department.id}"
                                    th:text="${department.name}">
                            </option>

                        </select>

                        <div class="invalid-feedback"
                             th:errors="*{departmentId}">
                        </div>

                    </div>


                    <!-- Specialization -->

                    <div class="col-md-6">

                        <label for="specialization"
                               class="form-label fw-semibold">
                            Specialization *
                        </label>

                        <input id="specialization"
                               class="form-control"
                               th:field="*{specialization}"
                               th:errorclass="is-invalid"
                               placeholder="e.g. General Medicine">

                        <div class="invalid-feedback"
                             th:errors="*{specialization}">
                        </div>

                    </div>


                    <!-- Phone -->

                    <div class="col-md-6">

                        <label for="phone"
                               class="form-label fw-semibold">
                            Phone *
                        </label>

                        <input id="phone"
                               class="form-control"
                               th:field="*{phone}"
                               th:errorclass="is-invalid"
                               placeholder="Enter phone number">

                        <div class="invalid-feedback"
                             th:errors="*{phone}">
                        </div>

                    </div>

                </div>


                <hr class="my-4">


                <div class="d-flex justify-content-end gap-2">

                    <a class="btn btn-outline-secondary px-4"
                       th:href="@{/admin/doctors}">
                        Cancel
                    </a>

                    <button class="btn btn-primary px-4"
                            type="submit">
                        Save Doctor
                    </button>

                </div>

            </form>

        </div>

    </section>

</main>

</body>
</html>
