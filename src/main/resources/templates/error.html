<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | MedSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <section class="card shadow-sm border-0 mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">
            <h1 class="h3 text-danger" th:text="${errorTitle}">Unable to complete request</h1>
            <p class="text-muted" th:text="${errorMessage}">Please try again.</p>
            <a class="btn btn-primary" th:href="@{/reception/patients}">Back to patients</a>
        </div>
    </section>
</main>
</body>
</html>
