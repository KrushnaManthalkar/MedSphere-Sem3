<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Appointment | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="dashboard-page">

<nav class="navbar navbar-expand-lg med-navbar">

    <div class="container-fluid px-4">

        <a class="navbar-brand med-brand"
           th:href="@{/}">
            <span class="brand-icon">+</span>
            MedSphere
        </a>

        <div class="d-flex gap-2">

            <a class="btn btn-outline-light btn-sm"
               th:href="@{/reception/appointments}">
                Back to Appointments
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="m-0">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button class="btn btn-outline-light btn-sm"
                        type="submit">
                    Sign out
                </button>

            </form>

        </div>

    </div>

</nav>


<main class="container-fluid px-4 py-4">

    <!-- Page Header -->

    <div class="page-header mb-4">

        <div>

            <div class="page-eyebrow">
                APPOINTMENT MANAGEMENT
            </div>

            <h1>New Appointment</h1>

            <p>
                Schedule an appointment for a patient.
            </p>

        </div>

    </div>


    <!-- Form -->

    <section class="content-card">

        <div class="content-card-header">

            <div>
                <h2>Appointment Information</h2>
                <p>Enter the details for the patient visit</p>
            </div>

        </div>


        <div class="card-body p-4">

            <!-- General Error -->

            <div th:if="${formError}"
                 class="alert alert-danger mb-4"
                 role="alert">

                <strong>Unable to create appointment</strong>

                <div th:text="${formError}">
                    Please review the information and try again.
                </div>

            </div>


            <form th:action="@{/reception/appointments}"
                  th:object="${appointmentForm}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <div class="row g-4">


                    <!-- Patient -->

                    <div class="col-md-6">

                        <label for="patientId"
                               class="form-label fw-semibold">
                            Patient
                        </label>

                        <select id="patientId"
                                class="form-select"
                                th:field="*{patientId}">

                            <option value="">
                                Select patient
                            </option>

                            <option th:each="patient : ${patients}"
                                    th:value="${patient.id}"
                                    th:text="${patient.patientCode + ' - ' + patient.name}">
                            </option>

                        </select>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('patientId')}"
                             th:errors="*{patientId}">
                        </div>

                    </div>


                    <!-- Doctor -->

                    <div class="col-md-6">

                        <label for="doctorId"
                               class="form-label fw-semibold">
                            Doctor
                        </label>

                        <select id="doctorId"
                                class="form-select"
                                th:field="*{doctorId}">

                            <option value="">
                                Select doctor
                            </option>

                            <option th:each="doctor : ${doctors}"
                                    th:value="${doctor.id}"
                                    th:text="${doctor.user.fullName + ' - ' + doctor.specialization}">
                            </option>

                        </select>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('doctorId')}"
                             th:errors="*{doctorId}">
                        </div>

                    </div>


                    <!-- Date -->

                    <div class="col-md-6">

                        <label for="appointmentDate"
                               class="form-label fw-semibold">
                            Appointment Date
                        </label>

                        <input id="appointmentDate"
                               type="date"
                               class="form-control"
                               th:field="*{appointmentDate}">

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('appointmentDate')}"
                             th:errors="*{appointmentDate}">
                        </div>

                    </div>


                    <!-- Time -->

                    <div class="col-md-6">

                        <label for="appointmentTime"
                               class="form-label fw-semibold">
                            Appointment Time
                        </label>

                        <input id="appointmentTime"
                               type="time"
                               class="form-control"
                               th:field="*{appointmentTime}">

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('appointmentTime')}"
                             th:errors="*{appointmentTime}">
                        </div>

                    </div>


                    <!-- Reason -->

                    <div class="col-12">

                        <label for="reason"
                               class="form-label fw-semibold">
                            Reason / Visit Purpose
                        </label>

                        <textarea id="reason"
                                  class="form-control"
                                  rows="4"
                                  th:field="*{reason}"
                                  placeholder="Enter the reason for the appointment"></textarea>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('reason')}"
                             th:errors="*{reason}">
                        </div>

                    </div>

                </div>


                <hr class="my-4">


                <!-- Actions -->

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/reception/appointments}"
                       class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-primary px-4">
                        Create Appointment
                    </button>

                </div>

            </form>

        </div>

    </section>

</main>

</body>
</html>
