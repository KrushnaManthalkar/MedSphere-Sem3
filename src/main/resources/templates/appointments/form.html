<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Appointment | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-semibold"
           th:href="@{/}">
            MedSphere
        </a>

        <form th:action="@{/logout}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button class="btn btn-outline-light btn-sm">
                Sign out
            </button>

        </form>

    </div>

</nav>

<main class="container py-4">

    <div class="mb-4">

        <a th:href="@{/reception/appointments}"
           class="text-decoration-none">
            ← Back to Appointments
        </a>

        <h1 class="h3 mt-3 mb-1">
            New Appointment
        </h1>

        <p class="text-muted mb-0">
            Schedule an appointment for a patient.
        </p>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <!-- General error -->

            <div th:if="${formError}"
                 class="alert alert-danger"
                 th:text="${formError}">
            </div>

            <form th:action="@{/reception/appointments}"
                  th:object="${appointmentForm}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="row g-4">

                    <!-- Patient -->

                    <div class="col-md-6">

                        <label for="patientId"
                               class="form-label">
                            Patient
                        </label>

                        <select id="patientId"
                                class="form-select"
                                th:field="*{patientId}">

                            <option value="">
                                Select patient
                            </option>

                            <option th:each="patient : ${patients}"
                                    th:value="${patient.id}"
                                    th:text="${patient.patientCode + ' - ' + patient.name}">
                            </option>

                        </select>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('patientId')}"
                             th:errors="*{patientId}">
                        </div>

                    </div>

                    <!-- Doctor -->

                    <div class="col-md-6">

                        <label for="doctorId"
                               class="form-label">
                            Doctor
                        </label>

                        <select id="doctorId"
                                class="form-select"
                                th:field="*{doctorId}">

                            <option value="">
                                Select doctor
                            </option>

                            <option th:each="doctor : ${doctors}"
                                    th:value="${doctor.id}"
                                    th:text="${doctor.user.fullName + ' - ' + doctor.specialization}">
                            </option>

                        </select>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('doctorId')}"
                             th:errors="*{doctorId}">
                        </div>

                    </div>

                    <!-- Date -->

                    <div class="col-md-6">

                        <label for="appointmentDate"
                               class="form-label">
                            Appointment Date
                        </label>

                        <input id="appointmentDate"
                               type="date"
                               class="form-control"
                               th:field="*{appointmentDate}">

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('appointmentDate')}"
                             th:errors="*{appointmentDate}">
                        </div>

                    </div>

                    <!-- Time -->

                    <div class="col-md-6">

                        <label for="appointmentTime"
                               class="form-label">
                            Appointment Time
                        </label>

                        <input id="appointmentTime"
                               type="time"
                               class="form-control"
                               th:field="*{appointmentTime}">

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('appointmentTime')}"
                             th:errors="*{appointmentTime}">
                        </div>

                    </div>

                    <!-- Reason -->

                    <div class="col-12">

                        <label for="reason"
                               class="form-label">
                            Reason / Visit Purpose
                        </label>

                        <textarea id="reason"
                                  class="form-control"
                                  rows="4"
                                  th:field="*{reason}"
                                  placeholder="Enter the reason for the appointment"></textarea>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('reason')}"
                             th:errors="*{reason}">
                        </div>

                    </div>

                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/reception/appointments}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        Create Appointment
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

</body>
</html>
