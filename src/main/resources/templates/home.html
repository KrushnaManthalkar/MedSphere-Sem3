<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">MedSphere</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-light btn-sm" type="submit">Sign out</button>
        </form>
    </div>
</nav>
<main class="container py-5">
    <div class="p-5 mb-4 bg-body-tertiary rounded-3 border">
        <div class="container-fluid py-3">
            <p class="text-primary fw-semibold mb-2">SEMESTER 3 · PHASE 4</p>
            <h1 class="display-6">Welcome, <span th:text="${username}">user</span>.</h1>
            <p class="col-md-8 fs-5 text-muted mb-0">
                Patient Management is ready for authorized Admin and Receptionist users.
            </p>
            <a th:if="${canManagePatients}" class="btn btn-primary mt-3" th:href="@{/reception/patients}">Open Patient Management</a>
            <a th:if="${canManagePatients}" class="btn btn-primary mt-3" th:href="@{/reception/appointments}">Open Appointment Management</a>
            <a th:if="${isAdmin}" class="btn btn-outline-primary mt-3" th:href="@{/admin/departments}">Open Admin Management</a>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
