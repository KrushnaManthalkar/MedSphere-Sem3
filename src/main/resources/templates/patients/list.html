<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients | MedSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/}">MedSphere</a>
    <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-light btn-sm">Sign out</button></form>
</div></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h1 class="h3 mb-1">Patient Management</h1><p class="text-muted mb-0">Register, find, and update patient information.</p></div>
        <a class="btn btn-primary" th:href="@{/reception/patients/new}">Register Patient</a>
    </div>
    <form class="card card-body shadow-sm border-0 mb-4" method="get" th:action="@{/reception/patients}">
        <div class="row g-2"><div class="col-md-9"><label class="visually-hidden" for="search">Search</label><input id="search" class="form-control" name="search" th:value="${search}" placeholder="Search by patient code, name, or phone"></div><div class="col-md-3 d-grid"><button class="btn btn-outline-primary">Search</button></div></div>
    </form>
    <div class="card shadow-sm border-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>Patient Code</th><th>Name</th><th>Date of Birth</th><th>Gender</th><th>Blood Group</th><th>Phone</th><th>Registered</th><th>Actions</th></tr></thead>
        <tbody><tr th:each="patient : ${patients}"><td class="fw-semibold" th:text="${patient.patientCode}"></td><td th:text="${patient.name}"></td><td th:text="${patient.dateOfBirth}"></td><td th:text="${patient.gender}"></td><td th:text="${patient.bloodGroup ?: '-'}"></td><td th:text="${patient.phone}"></td><td th:text="${patient.registrationDate}"></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/reception/patients/{id}(id=${patient.id})}">View</a> <a class="btn btn-sm btn-outline-secondary" th:href="@{/reception/patients/{id}/edit(id=${patient.id})}">Edit</a></td></tr>
        <tr th:if="${#lists.isEmpty(patients)}"><td colspan="8" class="text-center text-muted py-4">No patients found. Try another search or register a new patient.</td></tr></tbody>
    </table></div></div>
</main>
</body></html>
