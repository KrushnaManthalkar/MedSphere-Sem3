<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register Patient | MedSphere</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-semibold" th:href="@{/}">MedSphere</a><a class="btn btn-outline-light btn-sm" th:href="@{/reception/patients}">Back to Patients</a></div></nav>
<main class="container py-4" style="max-width: 900px;"><h1 class="h3 mb-1">Register Patient</h1><p class="text-muted">Patient code and registration date are generated automatically by the system.</p>
<form class="card shadow-sm border-0" th:action="@{/reception/patients}" th:object="${patientForm}" method="post"><div class="card-body p-4"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="row g-3"><div class="col-md-6"><label class="form-label">Full Name *</label><input class="form-control" th:field="*{name}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{name}"></div></div><div class="col-md-6"><label class="form-label">Date of Birth *</label><input type="date" class="form-control" th:field="*{dateOfBirth}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{dateOfBirth}"></div></div>
<div class="col-md-6"><label class="form-label">Gender *</label><select class="form-select" th:field="*{gender}" th:errorclass="is-invalid"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select><div class="invalid-feedback" th:errors="*{gender}"></div></div><div class="col-md-6"><label class="form-label">Blood Group</label><select class="form-select" th:field="*{bloodGroup}"><option value="">Not specified</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="AB+">AB+</option><option value="AB-">AB-</option><option value="O+">O+</option><option value="O-">O-</option></select></div>
<div class="col-md-6"><label class="form-label">Phone Number *</label><input class="form-control" th:field="*{phone}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{phone}"></div></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{email}"></div></div>
<div class="col-12"><label class="form-label">Address</label><textarea class="form-control" rows="2" th:field="*{address}"></textarea></div><div class="col-12"><label class="form-label">Emergency Contact</label><input class="form-control" th:field="*{emergencyContact}"></div></div>
<div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Register Patient</button><a class="btn btn-outline-secondary" th:href="@{/reception/patients}">Cancel</a></div></div></form></main></body></html>
