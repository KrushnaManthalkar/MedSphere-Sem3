<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Patient | MedSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="dashboard-page">

<nav class="navbar navbar-expand-lg med-navbar">
    <div class="container-fluid px-4">

        <a class="navbar-brand med-brand" th:href="@{/}">
            <span class="brand-icon">+</span>
            MedSphere
        </a>

        <div class="d-flex align-items-center gap-3">
            <span class="user-label d-none d-md-inline">
                Patient Registration
            </span>

            <a class="btn btn-outline-light btn-sm"
               th:href="@{/reception/patients}">
                Back to Patients
            </a>
        </div>

    </div>
</nav>


<main class="container py-5" style="max-width: 1000px;">

    <div class="page-header mb-4">

        <div>
            <div class="page-eyebrow">
                PATIENT MANAGEMENT
            </div>

            <h1 class="h2 mb-1">
                Register Patient
            </h1>

            <p class="text-muted mb-0">
                Create a new patient record and capture the essential
                registration details.
            </p>
        </div>

        <span class="record-badge">
            NEW RECORD
        </span>

    </div>


    <section class="content-card">

        <div class="content-card-header">

            <div>
                <h2 class="h5 mb-1">
                    Patient Information
                </h2>

                <p class="text-muted mb-0 small">
                    Patient code and registration date are generated
                    automatically by the system.
                </p>
            </div>

        </div>


        <div class="p-4 p-md-5">

            <form th:action="@{/reception/patients}"
                  th:object="${patientForm}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <div class="row g-4">

                    <!-- Full Name -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Full Name *
                        </label>

                        <input class="form-control"
                               th:field="*{name}"
                               th:errorclass="is-invalid"
                               placeholder="Enter patient's full name">

                        <div class="invalid-feedback"
                             th:errors="*{name}">
                        </div>

                    </div>


                    <!-- Date of Birth -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Date of Birth *
                        </label>

                        <input type="date"
                               class="form-control"
                               th:field="*{dateOfBirth}"
                               th:errorclass="is-invalid">

                        <div class="invalid-feedback"
                             th:errors="*{dateOfBirth}">
                        </div>

                    </div>


                    <!-- Gender -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Gender *
                        </label>

                        <select class="form-select"
                                th:field="*{gender}"
                                th:errorclass="is-invalid">

                            <option value="">
                                Select gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                        <div class="invalid-feedback"
                             th:errors="*{gender}">
                        </div>

                    </div>


                    <!-- Blood Group -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Blood Group
                        </label>

                        <select class="form-select"
                                th:field="*{bloodGroup}">

                            <option value="">
                                Not specified
                            </option>

                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>

                        </select>

                    </div>


                    <!-- Phone -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Phone Number *
                        </label>

                        <input class="form-control"
                               th:field="*{phone}"
                               th:errorclass="is-invalid"
                               placeholder="Enter phone number">

                        <div class="invalid-feedback"
                             th:errors="*{phone}">
                        </div>

                    </div>


                    <!-- Email -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               th:errorclass="is-invalid"
                               placeholder="Enter email address">

                        <div class="invalid-feedback"
                             th:errors="*{email}">
                        </div>

                    </div>


                    <!-- Address -->
                    <div class="col-12">

                        <label class="form-label fw-semibold">
                            Address
                        </label>

                        <textarea class="form-control"
                                  rows="3"
                                  th:field="*{address}"
                                  placeholder="Enter patient's address">
                        </textarea>

                    </div>


                    <!-- Emergency Contact -->
                    <div class="col-12">

                        <label class="form-label fw-semibold">
                            Emergency Contact
                        </label>

                        <input class="form-control"
                               th:field="*{emergencyContact}"
                               placeholder="Enter emergency contact">

                    </div>

                </div>


                <!-- Actions -->
                <div class="mt-5 pt-3 border-top d-flex flex-wrap gap-2">

                    <button type="submit"
                            class="btn btn-primary px-4">
                        Register Patient
                    </button>

                    <a class="btn btn-outline-secondary px-4"
                       th:href="@{/reception/patients}">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </section>

</main>

</body>
</html>
