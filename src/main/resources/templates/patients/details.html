<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Patient Profile | MedSphere</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-semibold" th:href="@{/}">MedSphere</a><a class="btn btn-outline-light btn-sm" th:href="@{/reception/patients}">Back to Patients</a></div></nav>
<main class="container py-4" style="max-width:900px"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div class="d-flex justify-content-between align-items-center mb-3"><div><p class="text-primary fw-semibold mb-1" th:text="${patient.patientCode}"></p><h1 class="h3 mb-0" th:text="${patient.name}"></h1></div><a class="btn btn-primary" th:href="@{/reception/patients/{id}/edit(id=${patient.id})}">Edit Patient</a></div>
<section class="card shadow-sm border-0"><div class="card-header bg-white"><h2 class="h5 mb-0">Patient Information</h2></div><div class="card-body"><dl class="row mb-0"><dt class="col-sm-4">Patient Code</dt><dd class="col-sm-8" th:text="${patient.patientCode}"></dd><dt class="col-sm-4">Full Name</dt><dd class="col-sm-8" th:text="${patient.name}"></dd><dt class="col-sm-4">Date of Birth</dt><dd class="col-sm-8" th:text="${patient.dateOfBirth}"></dd><dt class="col-sm-4">Gender</dt><dd class="col-sm-8" th:text="${patient.gender}"></dd><dt class="col-sm-4">Blood Group</dt><dd class="col-sm-8" th:text="${patient.bloodGroup ?: '-'}"></dd><dt class="col-sm-4">Phone</dt><dd class="col-sm-8" th:text="${patient.phone}"></dd><dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${patient.email ?: '-'}"></dd><dt class="col-sm-4">Address</dt><dd class="col-sm-8" th:text="${patient.address ?: '-'}"></dd><dt class="col-sm-4">Emergency Contact</dt><dd class="col-sm-8" th:text="${patient.emergencyContact ?: '-'}"></dd><dt class="col-sm-4">Registration Date</dt><dd class="col-sm-8" th:text="${patient.registrationDate}"></dd></dl></div></section></main></body></html>
