<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medical History - MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/reception/patients}">
            MedSphere
        </a>

        <a class="btn btn-light btn-sm"
           th:href="@{/reception/patients/{id}(id=${patient.id})}">
            Back to Patient
        </a>
    </div>
</nav>

<main class="container py-4">

    <div class="mb-4">
        <h1>Add Medical History</h1>
        <p class="text-muted mb-0">
            Patient:
            <strong th:text="${patient.name}"></strong>
            (<span th:text="${patient.patientCode}"></span>)
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/reception/patients/{id}/medical-history(id=${patient.id})}"
                  th:object="${medicalHistoryForm}"
                  method="post">

                <div class="mb-3">
                    <label for="conditionName" class="form-label">
                        Condition / Diagnosis
                    </label>

                    <input type="text"
                           id="conditionName"
                           th:field="*{conditionName}"
                           class="form-control"
                           placeholder="Enter condition or diagnosis"
                           required>
                </div>

                <div class="mb-3">
                    <label for="details" class="form-label">
                        Details
                    </label>

                    <textarea id="details"
                              th:field="*{details}"
                              class="form-control"
                              rows="5"
                              placeholder="Enter medical history details"></textarea>
                </div>

                <div class="mb-3">
                    <label for="recordDate" class="form-label">
                        Record Date
                    </label>

                    <input type="date"
                           id="recordDate"
                           th:field="*{recordDate}"
                           class="form-control"
                           required>
                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        Save Medical History
                    </button>

                    <a class="btn btn-secondary"
                       th:href="@{/reception/patients/{id}(id=${patient.id})}">
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</main>

</body>
</html>
