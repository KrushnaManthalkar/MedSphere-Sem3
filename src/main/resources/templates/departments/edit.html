<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Department | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="dashboard-page">

<nav class="navbar navbar-expand-lg med-navbar">

    <div class="container-fluid px-4">

        <a class="navbar-brand med-brand"
           th:href="@{/}">
            <span class="brand-icon">+</span>
            MedSphere
        </a>

        <div class="d-flex gap-2">

            <a class="btn btn-outline-light btn-sm"
               th:href="@{/admin/departments}">
                Departments
            </a>

            <a class="btn btn-outline-light btn-sm"
               th:href="@{/admin/doctors}">
                Doctors
            </a>

            <a class="btn btn-outline-light btn-sm"
               th:href="@{/}">
                Dashboard
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="m-0">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button class="btn btn-outline-light btn-sm"
                        type="submit">
                    Sign out
                </button>

            </form>

        </div>

    </div>

</nav>


<main class="container py-5">

    <!-- Page Header -->

    <div class="page-header mb-4">

        <div>

            <div class="page-eyebrow">
                ADMINISTRATION
            </div>

            <h1>Edit Department</h1>

            <p>
                Update the information for this hospital department.
            </p>

        </div>

        <a class="btn btn-outline-secondary"
           th:href="@{/admin/departments}">
            ← Back to Departments
        </a>

    </div>


    <!-- Success Message -->

    <div th:if="${successMessage}"
         class="alert alert-success border-0 shadow-sm mb-4"
         th:text="${successMessage}">
        Department updated successfully.
    </div>


    <!-- Form -->

    <div class="content-card">

        <div class="content-card-header">

            <div>
                <h2>Department Information</h2>
                <p>
                    Modify the department details below.
                </p>
            </div>

            <span class="record-badge"
                  th:text="'ID #' + ${department.id}">
                ID #1
            </span>

        </div>


        <form th:action="@{/admin/departments/{id}(id=${department.id})}"
              th:object="${departmentForm}"
              method="post"
              class="p-4">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <!-- Department Name -->

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Department Name
                    <span class="text-danger">*</span>
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{name}"
                       th:errorclass="is-invalid"
                       placeholder="e.g. Cardiology">

                <div class="invalid-feedback"
                     th:errors="*{name}">
                </div>

            </div>


            <!-- Description -->

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Description
                </label>

                <textarea class="form-control"
                          rows="5"
                          th:field="*{description}"
                          placeholder="Enter a short description of the department...">
                </textarea>

            </div>


            <!-- Actions -->

            <div class="d-flex gap-2 pt-2">

                <button type="submit"
                        class="btn btn-primary px-4">
                    Save Changes
                </button>

                <a class="btn btn-outline-secondary px-4"
                   th:href="@{/admin/departments}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
