<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Department | MedSphere</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:700px"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><h1 class="h3">Edit Department</h1><form class="card card-body shadow-sm" th:action="@{/admin/departments/{id}(id=${department.id})}" th:object="${departmentForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Department Name *</label><input class="form-control" th:field="*{name}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{name}"></div><label class="form-label mt-3">Description</label><textarea class="form-control" rows="4" th:field="*{description}"></textarea><div class="mt-4"><button class="btn btn-primary">Save Changes</button> <a class="btn btn-outline-secondary" th:href="@{/admin/departments}">Cancel</a></div></form></main></body></html>
