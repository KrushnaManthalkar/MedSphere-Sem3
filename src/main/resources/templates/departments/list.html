<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Departments | MedSphere</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/}">MedSphere</a><a class="btn btn-outline-light btn-sm" th:href="@{/admin/doctors}">Doctors</a></div></nav><main class="container py-4"><div class="d-flex justify-content-between mb-3"><div><h1 class="h3">Departments</h1><p class="text-muted">Admin management</p></div><a class="btn btn-primary" th:href="@{/admin/departments/new}">Add Department</a></div><div class="card shadow-sm border-0"><table class="table table-hover mb-0"><thead class="table-light"><tr><th>Name</th><th>Description</th><th></th></tr></thead><tbody><tr th:each="department : ${departments}"><td th:text="${department.name}"></td><td th:text="${department.description ?: '-'}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/departments/{id}/edit(id=${department.id})}">Edit</a></td></tr><tr th:if="${#lists.isEmpty(departments)}"><td colspan="3" class="text-center text-muted py-4">No departments created yet.</td></tr></tbody></table></div></main></body></html>
