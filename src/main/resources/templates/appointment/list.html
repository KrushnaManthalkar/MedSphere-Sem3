<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments | MedSphere</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            MedSphere
        </a>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button class="btn btn-outline-light btn-sm">
                Sign out
            </button>
        </form>
    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="h3 mb-1">Appointment Management</h1>

            <p class="text-muted mb-0">
                Schedule and manage patient appointments.
            </p>
        </div>

        <a class="btn btn-primary"
           th:href="@{/reception/appointments/new}">
            New Appointment
        </a>

    </div>

    <!-- Search and filters -->

    <form class="card card-body shadow-sm border-0 mb-4"
          method="get"
          th:action="@{/reception/appointments}">

        <div class="row g-2">

            <div class="col-md-6">

                <label class="visually-hidden"
                       for="search">
                    Search
                </label>

                <input id="search"
                       class="form-control"
                       name="search"
                       th:value="${search}"
                       placeholder="Search by patient code, patient name, or doctor">

            </div>

            <div class="col-md-4">

                <label class="visually-hidden"
                       for="status">
                    Status
                </label>

                <select id="status"
                        name="status"
                        class="form-select">

                    <option value="">
                        All Statuses
                    </option>

                    <option th:each="status : ${statuses}"
                            th:value="${status}"
                            th:text="${status}"
                            th:selected="${status.name() == selectedStatus}">
                    </option>

                </select>

            </div>

            <div class="col-md-2 d-grid">

                <button class="btn btn-outline-primary">
                    Search
                </button>

            </div>

        </div>

    </form>

    <!-- Appointment table -->

    <div class="card shadow-sm border-0">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-light">

                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="appointment : ${appointments}">

                    <td th:text="${appointment.appointmentDate}">
                    </td>

                    <td th:text="${appointment.appointmentTime}">
                    </td>

                    <td>

                        <div class="fw-semibold"
                             th:text="${appointment.patient.name}">
                        </div>

                        <small class="text-muted"
                               th:text="${appointment.patient.patientCode}">
                        </small>

                    </td>

                    <td th:text="${appointment.doctor.user.fullName}">
                    </td>

                    <td>

                        <span th:if="${appointment.reason != null}"
                              th:text="${appointment.reason}">
                        </span>

                        <span th:if="${appointment.reason == null}"
                              class="text-muted">
                            -
                        </span>

                    </td>

                    <td>

                        <span class="badge text-bg-primary"
                              th:if="${appointment.status.name() == 'SCHEDULED'}">
                            Scheduled
                        </span>

                        <span class="badge text-bg-success"
                              th:if="${appointment.status.name() == 'COMPLETED'}">
                            Completed
                        </span>

                        <span class="badge text-bg-danger"
                              th:if="${appointment.status.name() == 'CANCELLED'}">
                            Cancelled
                        </span>

                    </td>

                    <td class="text-nowrap">

                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/reception/appointments/{id}(id=${appointment.id})}">
                            View
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(appointments)}">

                    <td colspan="7"
                        class="text-center text-muted py-4">

                        No appointments found.
                        Create a new appointment to get started.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

</body>
</html>
